group 'com.zinonsoftware.video_compressor_plus'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Kotlin: AGP 9+ ships built-in Kotlin and enables it by default, and applying the
// Kotlin Gradle Plugin (KGP) on top of it is a hard error. KGP is therefore applied only
// when built-in Kotlin is not active: AGP < 9, or AGP 9+ with `android.builtInKotlin=false`
// (apps that still carry unmigrated plugins). `pluginManager.apply` rather than the literal
// `apply plugin:` form, because Flutter regex-scans this script for KGP and would warn
// even on the built-in path, where this branch never runs.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
        project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    pluginManager.apply('kotlin-android')
}

android {
    namespace 'com.zinonsoftware.video_compressor_plus'
    
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.zinonsoftware.video_compressor_plus'
    }
    
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
}

// When KGP is applied, jvmTarget must match the Java target. Built-in Kotlin derives it
// from compileOptions.targetCompatibility above.
plugins.withId('org.jetbrains.kotlin.android') {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.otaliastudios:transcoder:0.11.2'
}
