name: video_compressor_plus
description: >-
  Compress videos, trim them, strip audio, and extract thumbnails from Dart.
  A maintained continuation of video_compress, with Swift Package Manager support.
version: 4.0.0

homepage: https://github.com/zinon-software/video_compressor_plus
repository: https://github.com/zinon-software/video_compressor_plus
issue_tracker: https://github.com/zinon-software/video_compressor_plus/issues

topics:
  - video
  - compression
  - media
  - thumbnail
  - ffmpeg-alternative

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.zinonsoftware.video_compressor_plus
        pluginClass: VideoCompressPlugin
      ios:
        pluginClass: VideoCompressPlugin
      macos:
        pluginClass: VideoCompressPlugin
